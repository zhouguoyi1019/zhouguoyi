<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洛谷风 OJ - 计算机科学教育新生态</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --hd:#2d3c50; --hd-deep:#26334a;
  --bg:#ecf0f5; --card:#fff;
  --ink:#262b33; --muted:#7b8494; --line:#e3e8ef;
  --blue:#3498db; --blue-d:#2f89c5; --blue-bg:#eaf4fc;
  --ac:#52c41a; --ac-bg:#eaf7e4;
  --wa:#e74c3c; --wa-bg:#fdeeec;
  --tle:#f39c11; --tle-bg:#fdf3e3;
  --re:#8e44ad; --re-bg:#f4ecf9;
  /* 洛谷难度七色 */
  --d0:#fe4c61; --d1:#f39c11; --d2:#ffc116; --d3:#52c41a; --d4:#3498db; --d5:#9d3dcf; --d6:#0e1d69;
  --mono:"JetBrains Mono","IBM Plex Mono",Consolas,"Courier New",monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --logo:"ZCOOL QingKe HuangYou","Noto Sans SC",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-size:14px;line-height:1.7;color:var(--ink);background:var(--bg);min-height:100vh}
a{color:var(--blue);text-decoration:none}
a:hover{color:var(--blue-d)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.container{max-width:1170px;margin:0 auto;padding:18px 20px 60px}
h1,h2,h3{margin:0}

/* ---------- 顶栏 ---------- */
.lg-header{background:linear-gradient(180deg,var(--hd) 0%,var(--hd-deep) 100%);position:sticky;top:0;z-index:50;
  box-shadow:0 1px 4px rgba(0,0,0,.25)}
.lg-header-inner{max-width:1170px;margin:0 auto;display:flex;align-items:center;gap:22px;height:56px;padding:0 20px}
.lg-logo{display:flex;align-items:center;gap:9px;flex:none}
.lg-logo:hover{text-decoration:none}
.lg-logo-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#41b883,#2f89c5);
  color:#fff;font-family:var(--logo);font-size:20px;display:flex;align-items:center;justify-content:center}
.lg-logo-text{font-family:var(--logo);font-size:24px;color:#fff;letter-spacing:2px}
.lg-logo-sub{font-size:12px;color:rgba(255,255,255,.55);border-left:1px solid rgba(255,255,255,.2);padding-left:9px;letter-spacing:.06em}
.lg-nav{display:flex;gap:2px}
.lg-nav a{color:rgba(255,255,255,.78);padding:6px 14px;border-radius:6px;font-size:14.5px}
.lg-nav a:hover{color:#fff;background:rgba(255,255,255,.12);text-decoration:none}
.lg-nav a.active{color:#fff;background:rgba(255,255,255,.16);font-weight:700}
.lg-search{flex:1;max-width:260px;margin-left:auto}
.lg-search input{width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:6px;
  color:#fff;padding:6px 12px;font-size:13px;font-family:var(--sans)}
.lg-search input::placeholder{color:rgba(255,255,255,.45)}
.lg-search input:focus{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.4);outline:none}
.lg-user{display:flex;align-items:center;gap:10px;color:#fff;font-size:13.5px}
.lg-user .btn-login,.lg-user .btn-logout{color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.3);
  border-radius:6px;padding:4px 12px;background:transparent;cursor:pointer;font-size:13px;font-family:var(--sans)}
.lg-user .btn-login:hover,.lg-user .btn-logout:hover{background:rgba(255,255,255,.14);color:#fff}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.avatar.admin{background:var(--wa)}
.username{font-weight:500}
.role-badge{font-size:11px;background:var(--wa);border-radius:4px;padding:0 6px;color:#fff;letter-spacing:.05em}

/* ---------- 页面条 ---------- */
.lg-pagebar{background:#fff;border-bottom:1px solid var(--line)}
.lg-pagebar .inner{max-width:1170px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lg-pagebar b{color:var(--ink);font-size:15px;font-weight:700}

/* ---------- 卡片 / 按钮 / 表格 ---------- */
.lg-card{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:16px;overflow:hidden}
.lg-card .pad{padding:16px 20px}
.lg-btn{font-family:var(--sans);font-size:13.5px;font-weight:500;border:none;border-radius:6px;padding:7px 18px;
  cursor:pointer;transition:all .15s;line-height:1.5}
.lg-btn:active{transform:translateY(1px)}
.lg-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.lg-btn-primary{background:var(--blue);color:#fff}
.lg-btn-primary:hover:not(:disabled){background:var(--blue-d)}
.lg-btn-green{background:var(--ac);color:#fff}
.lg-btn-green:hover:not(:disabled){filter:brightness(1.08)}
.lg-btn-ghost{background:#fff;border:1px solid #cfd6e0;color:var(--ink)}
.lg-btn-ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.lg-btn-danger{background:#fff;border:1px solid #f0b9b3;color:var(--wa)}
.lg-btn-danger:hover:not(:disabled){background:var(--wa-bg)}
.lg-btn-sm{padding:3px 10px;font-size:12.5px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:500;
  padding:10px 16px;background:#f7f9fb;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 16px;border-bottom:1px solid #f0f3f7;font-size:14px}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:default}
.rowlink{cursor:pointer}
.rowlink:hover{background:#f5f9fd}
.tbl .num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tbl .num b{color:var(--ink)}

/* 难度色 */
.dif{font-weight:700;font-size:13.5px}
.dif.d0{color:var(--d0)} .dif.d1{color:var(--d1)} .dif.d2{color:var(--d2)} .dif.d3{color:var(--d3)}
.dif.d4{color:var(--d4)} .dif.d5{color:var(--d5)} .dif.d6{color:var(--d6)}
.tag{display:inline-block;font-size:12px;background:var(--blue-bg);color:var(--blue-d);border-radius:4px;
  padding:0 8px;margin:2px 4px 2px 0;cursor:default}
.st-ico{font-family:var(--mono);font-size:16px}
.st-ico.ok{color:var(--ac);font-weight:700}
.st-ico.tried{color:var(--tle)}
.st-ico.none{color:#ccd2dc}

/* 判定 */
.vd{font-weight:700;font-size:13.5px;white-space:nowrap}
.vd.AC{color:var(--ac)} .vd.WA{color:var(--wa)} .vd.TLE{color:var(--tle)} .vd.RE{color:var(--re)}
.score{font-family:var(--mono);font-weight:700;font-size:15px}
.score.s100{color:var(--ac)} .score.spart{color:var(--tle)} .score.s0{color:var(--wa)}

/* 用户色（洛谷 rating 色） */
.uc-0{color:#99a2ad}.uc-1{color:#3498db}.uc-2{color:#52c41a}.uc-3{color:#f39c11}.uc-4{color:#fe4c61}.uc-5{color:#9d3dcf}
.me-row td{background:#eaf4fc !important}
/* ---------- 题库筛选 ---------- */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px}
.filter-bar input[type=text],.filter-bar select{border:1px solid #cfd6e0;border-radius:6px;padding:6px 10px;
  font-size:13.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
.filter-bar input[type=text]{flex:1;min-width:180px}
.filter-bar input[type=text]:focus,.filter-bar select:focus{border-color:var(--blue);outline:none}
.acrate{font-family:var(--mono);font-size:12.5px}
.acrate.hi{color:var(--ac)} .acrate.mid{color:var(--tle)} .acrate.lo{color:var(--wa)}

/* ---------- 题目页 ---------- */
.problem-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.lg-tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px;background:#fff}
.lg-tabs a{padding:11px 18px;font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.lg-tabs a:hover{color:var(--ink);text-decoration:none}
.lg-tabs a.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
.sec-title{font-size:16px;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title::before{content:"";width:5px;height:18px;background:var(--blue);border-radius:3px;flex:none}
.stmt{white-space:pre-wrap;font-size:14.5px;color:#333c48}
.stmt code{font-family:var(--mono);background:#f2f4f8;border-radius:4px;padding:0 5px;font-size:13px}
.sample{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:10px 0 16px}
.sample .head{display:flex;align-items:center;background:#f7f9fb;border-bottom:1px solid var(--line);
  padding:7px 14px;font-size:12.5px;color:var(--muted)}
.sample .head .copy{margin-left:auto;border:none;background:transparent;color:var(--blue);cursor:pointer;
  font-size:12.5px;font-family:var(--sans)}
.sample .head .copy:hover{color:var(--blue-d)}
.sample pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.7;
  white-space:pre-wrap;word-break:break-all;min-height:44px}
.side-info .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px dashed #eef1f5}
.side-info .kv:last-child{border-bottom:none}
.side-info .k{color:var(--muted)}
.side-info .v{font-weight:500;text-align:right}

/* ---------- 编辑器 ---------- */
.editor-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:14px}
.editor-top{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#f7f9fb;border-bottom:1px solid var(--line);flex-wrap:wrap}
.editor-top .fname{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.editor-top .right{margin-left:auto;display:flex;gap:8px}
.lang-sel{border:1px solid #cfd6e0;border-radius:6px;padding:4px 8px;font-size:13px;font-family:var(--sans)}
.editor-body{display:flex;background:#21262e;height:420px}
.gutter{width:46px;flex:none;background:#1b2027;overflow:hidden}
.gutter-inner{padding:12px 10px 12px 0;text-align:right;color:#4a5568;font-family:var(--mono);
  font-size:13px;line-height:1.7;white-space:pre}
.code-input{flex:1;background:transparent;border:none;resize:none;outline:none;color:#e6ebf4;
  font-family:var(--mono);font-size:13px;line-height:1.7;padding:12px 14px;white-space:pre;overflow:auto;caret-color:#7fc3f2}

/* ---------- 评测结果（洛谷记录风格） ---------- */
.result-box{display:none;border-top:1px solid var(--line);padding:14px 16px;background:#fbfcfe}
.result-box.show{display:block}
.result-main{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:10px;animation:fadeUp .25s}
.result-status{font-size:21px;font-weight:700}
.result-status.AC{color:var(--ac)} .result-status.WA{color:var(--wa)} .result-status.TLE{color:var(--tle)} .result-status.RE{color:var(--re)}
.score-badge{font-family:var(--mono);font-size:26px;font-weight:700}
.score-badge.s100{color:var(--ac)} .score-badge.spart{color:var(--tle)} .score-badge.s0{color:var(--wa)}
.result-meta{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.pts{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.pt{width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:#fff;cursor:default}
.pt.pass{background:var(--ac)} .pt.fail{background:var(--wa)} .pt.tle{background:var(--tle)} .pt.re{background:var(--re)}
.pt.running{background:#b8c4d4;animation:pulse .9s infinite}
@keyframes pulse{50%{opacity:.35}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.diff-line{margin-top:10px}
.io2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.io2 .box{background:#21262e;color:#e6ebf4;border-radius:8px;padding:10px 13px;font-family:var(--mono);
  font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-all;overflow:auto;max-height:190px}
.io2 .box .lbl{color:#8894a8;font-size:11px;letter-spacing:.12em;display:block;margin-bottom:4px}
.errbox{background:var(--re-bg);border:1px solid #e2d1f0;color:#6c348a;border-radius:8px;padding:10px 13px;
  font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;margin-top:10px;max-height:180px;overflow:auto}

/* ---------- 弹窗 ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,28,40,.5);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:60;animation:fadeIn .15s}
.modal{background:#fff;border-radius:10px;width:100%;max-width:520px;max-height:88vh;overflow:auto;
  padding:24px 28px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h2{margin:0 0 16px;font-size:18px}
.modal .close{float:right;background:none;border:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 2px}
.modal .close:hover{color:var(--ink)}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.form-row input[type=text],.form-row input[type=password],.form-row input[type=number],
.form-row select,.form-row textarea{width:100%;border:1px solid #cfd6e0;border-radius:6px;padding:7px 10px;
  font-size:13.5px;font-family:var(--sans);background:#fff;color:var(--ink)}
.form-row textarea{font-family:var(--mono);font-size:12.5px;line-height:1.6;min-height:72px;resize:vertical}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--blue);outline:none}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-err{color:var(--wa);font-size:13px;min-height:20px;margin:2px 0 8px}
.test-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
.test-item .ti-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--muted)}
.test-item .ti-head .del{margin-left:auto;color:var(--wa);background:none;border:none;cursor:pointer;font-size:12.5px;font-family:var(--sans)}
.code-view{background:#21262e;color:#e6ebf4;border-radius:8px;padding:14px 16px;font-family:var(--mono);
  font-size:13px;line-height:1.7;white-space:pre;overflow:auto;max-height:320px;margin:0}

/* ---------- 排行榜 / 空状态 ---------- */
.rank-no{font-family:var(--mono);font-weight:700}
.rank-no.r1{color:#d4a017}.rank-no.r2{color:#8a95a3}.rank-no.r3{color:#b06f42}
.solved-dots{display:flex;gap:4px;flex-wrap:wrap}
.solved-dots .sd{width:9px;height:9px;border-radius:2px;background:#dde3ec}
.solved-dots .sd.on{background:var(--ac)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:15px;margin-bottom:6px;font-family:var(--mono)}

/* ---------- 首页 / 犇犇 ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.home-banner{background:linear-gradient(120deg,#2f89c5 0%,#41b883 100%);border-radius:10px;
  color:#fff;padding:26px 28px;margin-bottom:16px;position:relative;overflow:hidden}
.home-banner h1{font-family:var(--logo);font-size:34px;letter-spacing:3px;margin-bottom:8px}
.home-banner p{margin:0;opacity:.92;font-size:14.5px}
.home-banner .hb-stats{display:flex;gap:26px;margin-top:16px}
.home-banner .hb-stats b{font-size:24px;font-family:var(--mono)}
.home-banner .hb-stats span{display:block;font-size:12px;opacity:.8}
.benben-box{padding:14px 16px}
.benben-input{width:100%;border:1px solid #cfd6e0;border-radius:8px;padding:8px 12px;font-size:13.5px;
  font-family:var(--sans);resize:vertical;min-height:60px}
.benben-input:focus{border-color:var(--blue);outline:none}
.benben-list{max-height:520px;overflow:auto}
.benben{display:flex;gap:10px;padding:12px 4px;border-bottom:1px dashed #eef1f5}
.benben:last-child{border-bottom:none}
.benben .avatar{width:36px;height:36px;font-size:14px}
.benben .bb-body{flex:1;min-width:0}
.benben .bb-head{font-size:13px}
.benben .bb-text{font-size:13.5px;color:#333c48;margin:2px 0 4px;white-space:pre-wrap;word-break:break-word}
.benben .bb-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}
.benben .bb-like{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;font-family:var(--sans);padding:0}
.benben .bb-like:hover{color:var(--wa)}
.benben .bb-like.liked{color:var(--wa)}
.announce{padding:12px 16px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px dashed #eef1f5}
.announce:last-child{border-bottom:none}
.announce .a-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none;margin-top:8px}
.announce .a-date{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.home-list-item{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;border-bottom:1px dashed #eef1f5;font-size:13.5px}
.home-list-item:last-child{border-bottom:none}
.home-list-item .r{color:var(--muted);font-size:12.5px;font-family:var(--mono)}

/* ---------- 讨论区 ---------- */
.forum-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.forum-cat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s}
.forum-cat:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(52,152,219,.12)}
.forum-cat .fc-icon{font-size:22px}
.forum-cat .fc-name{font-weight:700;font-size:14px;margin:4px 0 2px}
.forum-cat .fc-count{font-size:12px;color:var(--muted)}
.thread-row{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid #f0f3f7;cursor:pointer;align-items:center}
.thread-row:hover{background:#f5f9fd}
.thread-row:last-child{border-bottom:none}
.thread-row .t-title{font-weight:500;font-size:14px}
.thread-row .t-meta{font-size:12px;color:var(--muted);margin-top:2px}
.thread-row .t-stat{text-align:right;font-size:12px;color:var(--muted);font-family:var(--mono);flex:none;width:70px}
.reply{display:flex;gap:10px;padding:12px 16px;border-bottom:1px dashed #eef1f5}
.reply:last-child{border-bottom:none}
.reply .avatar{width:32px;height:32px;font-size:12px}
.reply .r-body{flex:1;min-width:0}
.reply .r-text{font-size:13.5px;white-space:pre-wrap;word-break:break-word;color:#333c48;margin-top:2px}
.reply .r-meta{font-size:11.5px;color:var(--muted)}
.reply-box{padding:12px 16px;border-top:1px solid var(--line);background:#fbfcfe}
.reply-box textarea{width:100%;border:1px solid #cfd6e0;border-radius:8px;padding:8px 12px;font-size:13px;
  font-family:var(--sans);min-height:64px;resize:vertical}
.reply-box textarea:focus{border-color:var(--blue);outline:none}

/* ---------- 比赛 ---------- */
.contest-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #f0f3f7;cursor:pointer}
.contest-row:hover{background:#f5f9fd}
.contest-row:last-child{border-bottom:none}
.ct-badge{flex:none;width:74px;text-align:center;border-radius:6px;color:#fff;font-size:12.5px;padding:5px 0;font-weight:700}
.ct-badge.running{background:var(--ac)} .ct-badge.soon{background:var(--blue)} .ct-badge.done{background:#95a0b1}
.ct-title{font-weight:700;font-size:15px}
.ct-meta{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.ct-rank-row td{font-size:13.5px}
.standings td{font-size:13.5px}

/* ---------- 题解 ---------- */

function fib(n){let a=1,b=1;for(let i=3;i<=n;i++){const t=a+b;a=b;b=t}return n<=2?1:b}
function countPrimes(n){let c=0;for(let i=2;i<=n;i++){let p=true;for(let j=2;j*j<=i;j++)if(i%j===0){p=false;break}if(p)c++}return c}
function pascal(n){const out=[];let prev=[];for(let i=0;i<n;i++){const cur=[];for(let j=0;j<=i;j++)cur.push(j===0||j===i?1:prev[j-1]+prev[j]);out.push(cur.join(" "));prev=cur}return out.join("\n")}

/* ===================== 评测引擎（Worker 沙箱 + 洛谷部分分制） ===================== */
const WORKER_SRC='self.onmessage=function(e){var lines=String(e.data.input).split("\\n");var i=0;var out=[];'
 +'self.readline=function(){return i<lines.length?lines[i++]:null};'
 +'var push=function(){out.push(Array.prototype.slice.call(arguments).join(" "))};'
 +'console.log=push;console.info=push;console.warn=push;console.error=push;'
 +'var err=null;try{(0,eval)(e.data.code)}catch(ex){err=(ex&&ex.stack)?String(ex.stack):String(ex)}'
 +'self.postMessage({out:out.join("\\n"),err:err})};';
let WORKER_URL=null;
function getWorkerUrl(){if(!WORKER_URL)WORKER_URL=URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"}));return WORKER_URL}
function normOut(s){return String(s).replace(/\r/g,"").split("\n").map(l=>l.replace(/[ \t]+$/,"")).join("\n").replace(/\n+$/,"").trim()}
function runTest(code,input,limit){
  return new Promise(resolve=>{
    const worker=new Worker(getWorkerUrl());
    const t0=performance.now();
    const timer=setTimeout(()=>{worker.terminate();
      resolve({status:"TLE",out:"",err:"",time:Math.round(performance.now()-t0)})},limit);
    worker.onmessage=ev=>{
      clearTimeout(timer);
      const time=Math.round(performance.now()-t0),d=ev.data;
      worker.terminate();
      if(d.err)resolve({status:"RE",out:d.out,err:d.err,time});
      else resolve({status:"OK",out:d.out,err:"",time});
    };
    worker.postMessage({code,input});
  });
}
const VD_TEXT={AC:"Accepted",WA:"Wrong Answer",TLE:"Time Limit Exceeded",RE:"Runtime Error"};
function scoreClass(s){return s===100?"s100":s>0?"spart":"s0"}

function fmtTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}

async function runSample(p){
  const s=p.tests.find(t=>t.sample)||p.tests[0];
  const box=$("#result-box");
  box.classList.add("show");
  setBtns(false);
  box.innerHTML=`<div class="result-main"><span class="result-status" style="font-size:16px;color:var(--muted)">运行样例中…</span></div>`;
  const r=await runTest($("#code").value,s.input,5000);
  setBtns(true);
  if(r.status==="RE"){
    box.innerHTML=`<div class="result-main"><span class="result-status RE">Runtime Error</span></div>
      <div class="errbox">${esc(r.err.slice(0,600))}</div>`;return;
  }
  if(r.status==="TLE"){
    box.innerHTML=`<div class="result-main"><span class="result-status TLE">Time Limit Exceeded</span>
      <span class="result-meta">样例运行超过 5s</span></div>`;return;
  }
  const ok=normOut(r.out)===normOut(s.output);
  box.innerHTML=`<div class="result-main">
      <span class="result-status ${ok?"AC":"WA"}">${ok?"样例通过":"样例不通过"}</span>
      <span class="result-meta">耗时 ${r.time} ms</span></div>
    <div class="io2">
      <div class="box"><span class="lbl">你的输出</span>${esc(normOut(r.out))||"（空）"}</div>
      <div class="box"><span class="lbl">期望输出</span>${esc(s.output)}</div></div>`;
}
function setBtns(on){
  const a=$("#btn-submit"),b=$("#btn-run-sample");

/* ---- 正式评测：全部测试点 + 部分分 ---- */
async function doSubmit(p){
  if(!curUser()){openLogin("登录后才能提交评测（试试站长账号）");return}
  const code=$("#code").value;
  if(!code.trim())return;
  lsSave(LS.draft+p.id,code);
  const box=$("#result-box");
  box.classList.add("show");
  setBtns(false);
  $("#btn-submit").textContent="评测中…";
  box.innerHTML=`<div class="result-main"><span class="result-status" style="font-size:16px;color:var(--muted)">正在评测…</span>
    <span class="result-meta">共 ${p.tests.length} 个测试点</span></div>
    <div class="pts">${p.tests.map((_,i)=>`<span class="pt running" id="pt-${i}">${i+1}</span>`).join("")}</div>`;
  const points=[];let maxTime=0;
  for(let i=0;i<p.tests.length;i++){
    const el=$("#pt-"+i);
    const r=await runTest(code,p.tests[i].input,p.timeMs);
    let st;
    if(r.status==="TLE")st="tle";
    else if(r.status==="RE")st="re";
    else st=normOut(r.out)===normOut(p.tests[i].output)?"pass":"fail";
    el.className="pt "+st;
    el.title=`测试点 #${i+1} · ${st==="pass"?"通过":st==="fail"?"答案错误":st==="tle"?"超时":"运行错误"} · ${r.time} ms`;
    points.push({st,time:r.time});
    maxTime=Math.max(maxTime,r.time);
  }
  const passN=points.filter(x=>x.st==="pass").length;
  const score=Math.round(passN/p.tests.length*100);
  const badIdx=points.findIndex(x=>x.st!=="pass");
  const verdict=badIdx<0?"AC":(points[badIdx].st==="fail"?"WA":points[badIdx].st==="tle"?"TLE":"RE");
  let extra="";
  if(verdict==="WA"){
    const r=await Promise.resolve({out:box.dataset.out||""}); // 占位不用
    const i=badIdx;
    const got=await runTest(code,p.tests[i].input,p.timeMs);
    extra=`<div class="diff-line"><div class="result-meta">测试点 #${i+1}（${got.time} ms）答案不符：</div>
      <div class="io2"><div class="box"><span class="lbl">你的输出</span>${esc(normOut(got.out))||"（空）"}</div>
      <div class="box"><span class="lbl">期望输出</span>${esc(p.tests[i].output)}</div></div></div>`;
  }else if(verdict==="RE"){
    const r=await runTest(code,p.tests[badIdx].input,p.timeMs);
    extra=`<div class="errbox">测试点 #${badIdx+1} 运行错误：\n${esc(r.err.slice(0,600))}</div>`;
  }else if(verdict==="TLE"){
    extra=`<div class="result-meta" style="margin-top:8px">测试点 #${badIdx+1} 超过 ${(p.timeMs/1000).toFixed(2)}s 时间限制，程序被强制终止。检查是否存在死循环或低效算法。</div>`;
  }
  box.innerHTML=`<div class="result-main">
      <span class="result-status ${verdict}">${VD_TEXT[verdict]}</span>
      <span class="score-badge ${scoreClass(score)}">${score} 分</span>
      <span class="result-meta">得分 ${passN}/${p.tests.length} · 最大耗时 ${maxTime} ms · JavaScript</span>
    </div>
    <div class="pts">${points.map((x,i)=>`<span class="pt ${x.st}" title="测试点 #${i+1} · ${x.time} ms">${i+1}</span>`).join("")}</div>
    ${extra}`;
  setBtns(true);
  addSub({id:Date.now(),ts:Date.now(),user:session,pid:p.id,verdict,score,time:maxTime,
    points:points.map(x=>({st:x.st,time:x.time})),total:p.tests.length,code});
  if(verdict==="AC")markSolved(p.id);
}

function renderStats(p){

    <div class="sb-track"><div class="sb-fill" style="width:${pct(n)}%;background:${color}"></div></div>

function openProblemForm(p){
  const isNew=!p;
  const data=isNew?{id:"",title:"",diff:1,timeMs:1000,tags:[],desc:"",inputDesc:"",outputDesc:"",tests:[]}:JSON.parse(JSON.stringify(p));
  openModal(`<h2>${isNew?"新建题目":"编辑题目 "}${p?p.id:""}
      <button class="close" aria-label="关闭">×</button></h2>
    <div class="form-grid2">
      <div class="form-row"><label>题号（如 P2001）</label><input type="text" id="pf-id" value="${esc(data.id)}" ${isNew?"":"disabled"}></div>
      <div class="form-row"><label>标题</label><input type="text" id="pf-title" value="${esc(data.title)}"></div>
      <div class="form-row"><label>难度</label><select id="pf-diff">
        ${DIFFS.map((d,i)=>`<option value="${i}" ${data.diff===i?"selected":""}>${d}</option>`).join("")}</select></div>
      <div class="form-row"><label>时间限制（ms）</label><input type="number" id="pf-time" value="${data.timeMs}" min="100" step="100"></div>
    </div>
    <div class="form-row"><label>标签（逗号分隔）</label><input type="text" id="pf-tags" value="${esc(data.tags.join(", "))}"></div>
    <div class="form-row"><label>题目描述</label><textarea id="pf-desc">${esc(data.desc)}</textarea></div>
    <div class="form-row"><label>输入格式</label><textarea id="pf-in">${esc(data.inputDesc)}</textarea></div>
    <div class="form-row"><label>输出格式</label><textarea id="pf-out">${esc(data.outputDesc)}</textarea></div>
    <div class="form-row"><label style="margin-bottom:8px">测试点（勾选「样例」会在题面中展示）
      <button class="lg-btn lg-btn-ghost lg-btn-sm" id="pf-add-test" style="float:right">+ 添加测试点</button></label>
      <div id="pf-tests"></div></div>
    <div class="form-err" id="pf-err"></div>
    <button class="lg-btn lg-btn-primary" id="pf-save" style="width:100%;padding:9px">保存题目</button>`,true);
  const testsBox=$("#pf-tests");
  const drawTests=()=>{
    testsBox.innerHTML=data.tests.map((t,i)=>`
      <div class="test-item">
        <div class="ti-head"><label style="display:flex;align-items:center;gap:5px;margin:0">
          <input type="checkbox" data-tsample="${i}" ${t.sample?"checked":""}> 作为样例展示</label>
          <span>测试点 #${i+1}</span>
          <button class="del" data-tdel="${i}">删除</button></div>
        <div class="form-grid2">
          <div class="form-row" style="margin:0"><label>输入</label><textarea data-tin="${i}">${esc(t.input)}</textarea></div>
          <div class="form-row" style="margin:0"><label>输出</label><textarea data-tout="${i}">${esc(t.output)}</textarea></div>
        </div></div>`).join("")||`<div style="color:var(--muted);font-size:13px;padding:6px 0">还没有测试点，点击右上角添加</div>`;
    testsBox.querySelectorAll("[data-tin]").forEach(el=>el.addEventListener("input",()=>data.tests[+el.dataset.tin].input=el.value));
    testsBox.querySelectorAll("[data-tout]").forEach(el=>el.addEventListener("input",()=>data.tests[+el.dataset.tout].output=el.value));
    testsBox.querySelectorAll("[data-tsample]").forEach(el=>el.addEventListener("change",()=>data.tests[+el.dataset.tsample].sample=el.checked));
    testsBox.querySelectorAll("[data-tdel]").forEach(el=>el.addEventListener("click",()=>{data.tests.splice(+el.dataset.tdel,1);drawTests()}));
  };
  drawTests();
  $("#pf-add-test").addEventListener("click",()=>{data.tests.push({input:"",output:"",sample:false});drawTests()});
  $("#pf-save").addEventListener("click",()=>{
    const id=$("#pf-id").value.trim().toUpperCase();
    const title=$("#pf-title").value.trim();
    const err=$("#pf-err");
    if(!/^P\d+$/.test(id))return err.textContent="题号格式应为 P + 数字，如 P2001";
    if(!title)return err.textContent="请填写标题";
    if(!data.tests.length)return err.textContent="至少需要一个测试点";
    if(data.tests.some(t=>!t.input||!t.output))return err.textContent="每个测试点的输入和输出都不能为空";
    if(isNew&&PMAP[id])return err.textContent=`题号 ${id} 已存在`;
    const prob={id,title,diff:Number($("#pf-diff").value),timeMs:Math.max(100,Number($("#pf-time").value)||1000),
      tags:$("#pf-tags").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      acRate:PMAP[id]?PMAP[id].acRate:0,desc:$("#pf-desc").value,
      inputDesc:$("#pf-in").value,outputDesc:$("#pf-out").value,
      tests:data.tests.map(t=>({input:t.input,output:t.output,sample:!!t.sample})),
      starter:PMAP[id]&&PMAP[id].starter?PMAP[id].starter:STARTER};
    customProblems=customProblems.filter(c=>c.id!==id);
    customProblems.push(prob);
    deletedIds=deletedIds.filter(x=>x!==id);
    persistProblems();closeModal();renderAdmin();
  });
}
/* ===================== 弹窗 / 路由 / 启动 ===================== */
let escHandler=null;
function openModal(html,wide){
  $("#modal-root").innerHTML=`<div class="overlay"><div class="modal ${wide?"wide":""}" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=$("#modal-root .overlay");
  ov.addEventListener("click",e=>{if(e.target===ov)closeModal()});
  ov.querySelector(".close").addEventListener("click",closeModal);
  escHandler=e=>{if(e.key==="Escape")closeModal()};
  document.addEventListener("keydown",escHandler);
}
function closeModal(){
  $("#modal-root").innerHTML="";
  if(escHandler){document.removeEventListener("keydown",escHandler);escHandler=null}
}
function setNav(key){
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.dataset.nav===key));
}
function route(){
  closeModal();
  const h=location.hash||"#/";
  if(h==="#"||h==="#/"){setNav("home");renderHome();return}
  const m=h.match(/^#\/problem\/(\w+)(?:\/(\w+))?/);
  if(m){setNav("problems");renderProblem(m[1],m[2])}
  else if(h==="#/problems"){setNav("problems");renderList()}
  else if(h==="#/records"){setNav("records");renderRecords()}
  else if(h==="#/rank"){setNav("rank");renderRank()}
  else if(h==="#/discuss"){setNav("discuss");renderDiscuss()}
  else if(h.startsWith("#/thread/")){setNav("discuss");renderThread(Number(h.split("/")[2]))}
  else if(h==="#/contests"){setNav("contests");renderContests()}
  else if(h.startsWith("#/contest/")){setNav("contests");renderContest(Number(h.split("/")[2]))}
  else if(h.startsWith("#/user/")){setNav("home");renderProfile(decodeURIComponent(h.split("/")[2]||""))}
  else if(h==="#/admin"){setNav("admin");renderAdmin()}
  else{setNav("problems");renderList()}
}
renderUser();
route();
window.addEventListener("hashchange",route);
$("#global-search").addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const q=e.target.value.trim().toLowerCase();
  if(!q)return;
  const hit=PROBLEMS.find(p=>p.id.toLowerCase()===q)
    ||PROBLEMS.find(p=>p.title.toLowerCase().includes(q)||p.id.toLowerCase().includes(q));
  if(hit){location.hash="#/problem/"+hit.id;e.target.value=""}
  else{location.hash="#/problems";setTimeout(()=>{listState.q=e.target.value;
    const el=$("#f-q");if(el){el.value=e.target.value;el.dispatchEvent(new Event("input"))}},50);e.target.value=""}
});
</script>
</body>
</html>
